<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'" />
  <title>Qiu_Ai_LZ</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #141414;
      color: #eeeeee;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      user-select: none;
    }
    h1 { font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }
    .status {
      font-size: 12px;
      color: #999;
      min-height: 32px;
      max-width: 380px;
      text-align: center;
      line-height: 1.6;
      word-break: break-all;
    }
    .status.ready { color: #4caf7d; }
    .status.warn { color: #d9a052; }
    .status.failed { color: #d65252; }
  </style>
</head>
<body>
  <h1>Qiu_Ai_LZ</h1>
  <div id="status" class="status">正在启动…</div>

  <script>
    const statusEl = document.getElementById('status');
    window.qiuDesktopShell.onStatus(({ text, level }) => {
      statusEl.textContent = text;
      statusEl.className = 'status' + (level && level !== 'info' ? ' ' + level : '');
    });
  </script>
</body>
</html>
